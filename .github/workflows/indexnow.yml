# Prévient Bing (et les autres moteurs IndexNow) à chaque mise à jour du site.
name: IndexNow
on:
  push:
    branches: [main]
    paths: ['sitemap.xml', 'papiers/**', 'index.html', 'journal/**', 'lexique/**', 'constellation/**', 'chimere/**']
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attendre la mise en ligne de GitHub Pages
        run: sleep 120
      - name: Envoyer les adresses du plan du site
        run: |
          KEY=4baf30205c4823a4459136ad6deea853
          URLS=$(grep -o '<loc>[^<]*' sitemap.xml | sed 's/<loc>//' | python3 -c "import sys,json;print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))")
          BODY=$(printf '{"host":"eliassorel.com","key":"%s","keyLocation":"https://eliassorel.com/%s.txt","urlList":%s}' "$KEY" "$KEY" "$URLS")
          curl -s -o /dev/null -w "IndexNow : HTTP %{http_code}\n" -X POST "https://api.indexnow.org/indexnow" -H "Content-Type: application/json; charset=utf-8" -d "$BODY"
