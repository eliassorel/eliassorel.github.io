  for(let fy=120-h+6;fy<114;fy+=9)for(let fx=x+4;fx<x+w-5;fx+=7){const f=document.createElementNS(NS,'rect');f.setAttribute('x',fx);f.setAttribute('y',fy);f.setAttribute('width',3);f.setAttribute('height',4);f.setAttribute('fill','#f4e3b8');f.setAttribute('opacity',Math.random()<.08?'.85':'0');s.appendChild(f);fen.push(f)}
  x+=w+2;i++}
 if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 setInterval(()=>{const f=fen[Math.floor(Math.random()*fen.length)];f.style.transition='opacity 1.6s';f.setAttribute('opacity',f.getAttribute('opacity')==='0'?'.85':'0')},500)})();
