/* le son du BONK, seulement après un premier toucher (les navigateurs l'exigent) */
(function(){let ac=null;const T=14000,t0=performance.now();
function bonk(){if(!ac)return;try{const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.setValueAtTime(320,t);o.frequency.exponentialRampToValueAtTime(70,t+.25);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.3,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+.35);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+.4)}catch(e){}}
addEventListener('pointerdown',()=>{if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}},{once:true});
if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
function smack(){if(!ac)return;try{const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.setValueAtTime(500,t);o.frequency.exponentialRampToValueAtTime(1400,t+.18);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.25,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.25);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+.3)}catch(e){}}
let n=-1,m=-1;setInterval(()=>{const now=performance.now()-t0,k=Math.floor((now-T*.25)/T),j=Math.floor((now-T*.75)/T);if(k>n&&k>=0){n=k;bonk()}if(j>m&&j>=0){m=j;smack()}},40);
})();
</script>
